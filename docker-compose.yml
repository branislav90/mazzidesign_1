services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Woodwork!Dev2026}"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Local SMTP sink — view outgoing workshop emails at http://localhost:5025
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5025:80"
      - "2525:25"

volumes:
  mssql-data:
