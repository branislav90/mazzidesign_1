services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: woodwork
      POSTGRES_USER: woodwork
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Woodwork!Dev2026}"
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodwork -d woodwork"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local SMTP sink — view outgoing workshop emails at http://localhost:5025
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5025:80"
      - "2525:25"

volumes:
  pg-data:
